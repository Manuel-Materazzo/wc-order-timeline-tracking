name: Claude Assistant
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      github.actor == 'Manuel-Materazzo' && (
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.issue.body, '@claude') ||
      contains(github.event.review.body, '@claude')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Picks the model based on the tag
      - name: Select Model
        id: model
        run: |
          BODY="${{ github.event.comment.body || github.event.issue.body }}"
          if [[ "$BODY" == *"@claude-opus"* ]]; then
            echo "name=claude-opus-5-5" >> $GITHUB_OUTPUT
          else
            echo "name=claude-sonnet-5-5" >> $GITHUB_OUTPUT
          fi

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model ${{ steps.model.outputs.name }}"